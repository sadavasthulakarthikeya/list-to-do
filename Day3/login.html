<html>
    <body>
        <form id="myForm">
            <p>Enter your name: </p>
            <input type="text" id="name" placeholder="enter your name">
            <p id="nameError" style="color:red;"></p>
            <p>Enter your age:</p>
            <input type="text" id="age" placeholder="enter your age">
            <p>Enter your parent name:</p>
            <input type="text" id="parentName" placeholder="parent name">
            <p>Set password</p>
            <input type="password" id="password" placeholder="enter password">
            <p id="passwordError" style="color:red;"></p>
            <br><br>
            <button type="button" onclick="validateForm()">Submit</button>
        </form>
        <script>
         function validateForm() {
                let name = document.getElementById("name").value;
                let password = document.getElementById("password").value;
                let nameError = document.getElementById("nameError");
                let passwordError = document.getElementById("passwordError");
                let valid = true;
                if (!name.match(/^[A-Za-z]+$/)) {
                    nameError.textContent = "Name should contain only letters.";
                    valid = false;
                } else {
                    nameError.textContent = "";
                }
                if (password.length < 8 || !password.match(/[A-Za-z]/) || !password.match(/[0-9]/)) {
                    passwordError.textContent = "Password should be at least 8 characters, include letters and numbers.";
                    valid = false;
                } else {
                    passwordError.textContent = "";
                }
                if (valid) {
                    alert("Form submitted successfully!");
                }
            }
        </script>

    </body>
</html>
