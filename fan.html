<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fan Simulation</title>
  <link rel="stylesheet" href="fan.css"/>
</head>
<body>
  <div class="fan-container">
    <div class="fan">
      <div class="blade blade1"></div>
      <div class="blade blade2"></div>
      <div class="blade blade3"></div>
      <div class="center"></div>
    </div>
    <div class="controls">
      <button id="onoff">ON</button>
      <button id="speed1">1</button>
      <button id="speed2">2</button>
      <button id="speed3">3</button>
    </div>
  </div>
  <script src="fan.js"></script>
</body>
</html>
