<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Finder</title>
</head>
<body>
    <form>
        <label for="name">Name</label>
        <input type="text" name="name" id="name" required><br><br>
        <label for="age">Age</label>
        <input type="number" name="age" id="age" required>
        <button id="btn">Submit</button>
    </form>
    <h2 id="ans"></h2>
    <script>
        function getUser(){
            return new Promise((resolve, reject)=>{
                let users=[];
                setTimeout(()=>{
                    users=[{name:"annie",age:34},{name:"punith",age:45}];
                    resolve(users);
                },2000);
            });
        }
        function finddUser(name,age,result){
            getUser().then((user)=>{
                const ans = user.find((data)=>data.name===name && data.age===parseInt(age));
                if(ans)
                    result.innerHTML = `Name: ${ans.name}, Age: ${ans.age}`;
                else
                    result.innerHTML="Sorry, user doesn't exist";
            });
        }
        let bt = document.getElementById('btn');
        bt.addEventListener('click',(event)=>{
            event.preventDefault();
            const name=document.getElementById('name').value;
            const age = document.getElementById('age').value;
            let ans=document.getElementById('ans');
            finddUser(name,age,ans);
        });
    </script>
</body>
</html>
