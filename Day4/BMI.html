<html>
<head>
  <title>BMI Calculator</title>
</head>
<style>
    body{
        background-color: rgb(220, 220, 220);
        margin-top: 15%;
        margin-left: 30%;
        margin-right: 30%;
        font-size: 1.2rem;
    }
    .cal{
        background-color: white;
        height: 40%;
        border-radius: 20px;
        
    }
    .inner{
        text-align: center;
        align-items: center;
    }
</style>
<body>
<div class="cal">
<div class="inner">
  <h2>BMI Calculator</h2><br>
  <label for="weight">Enter your weight (kg): </label>
  <input type="number" id="weight" placeholder="Weight in kg">
  <br><br>
  <label for="height">Enter your height (cm): </label>
  <input type="number" id="height" placeholder="Height in cm">
  <br><br>
  <button onclick="calculateBMI()">Calculate BMI</button>
  <br>
  <p id="result"></p>
</div>
</div>
  <script>
    function calculateBMI() {
      let weight = document.getElementById("weight").value;
      let heightCm = document.getElementById("height").value;
      if (weight > 0 && heightCm > 0) {
        let heightM = heightCm / 100;
        let bmi = weight / (heightM * heightM);
        let category = "";
        if(bmi < 18.5){
            category="underweight";
        }
        else if(bmi<24.5 && bmi>18.5){
            category="normalweight";
        }
        else if(bmi<29.5 && bmi>24.5){
            category="overweight";
        }
        else{
            category="obese";
        }
        document.getElementById("result").innerText=
        "YOUR BMI VALUES IS :"+ bmi.toFixed(2) +"("+category+")";
      }
      else{
        document.getElementById("result").innerText=
        "INVALID HEIGHT AND WEIGHT"
      }
    }
  </script>
</body>
</html>
